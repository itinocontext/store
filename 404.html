<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6BBF7A" />
    <meta name="description" content="ITI — European streetwear inspired by racing culture." />
    <title>ITI — NoContext</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="preload" as="image" href="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/verde.png" />
    <link rel="preload" as="image" href="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/rosa.png" />
    <link rel="preload" as="image" href="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/azul.png" />
    <link rel="preload" as="image" href="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/negro.png" />

    <style>
      :root {
        --bg: #6bbf7a;
        --panel: #85cc92;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: "Inter", sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      a {
        font: inherit;
      }

      button {
        border: 0;
      }

      a {
        color: inherit;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 560px;
        overflow: hidden;
        isolation: isolate;
        background-color: var(--bg);
        transition: background-color 650ms var(--ease);
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.4;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        background-size: 200px 200px;
        background-repeat: repeat;
      }

      .ghost-title {
        position: absolute;
        top: 18%;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        overflow: hidden;
        font-family: "Anton", sans-serif;
        font-size: clamp(90px, 28vw, 380px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #fff;
      }

      .topbar {
        position: absolute;
        top: 24px;
        left: 32px;
        right: 32px;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .brand-area,
      .cart-button {
        pointer-events: auto;
      }

      .brand-area {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .brand {
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.92;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .nav a {
        text-decoration: none;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.78;
        transition: opacity 180ms ease;
      }

      .nav a:hover {
        opacity: 1;
      }

      .cart-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 13px;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 999px;
        color: #fff;
        background: transparent;
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .cart-button:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-1px);
      }

      .carousel {
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .carousel-item {
        position: absolute;
        aspect-ratio: 0.6 / 1;
        transform: translateX(-50%) scale(1);
        transition:
          transform 650ms var(--ease),
          filter 650ms var(--ease),
          opacity 650ms var(--ease),
          left 650ms var(--ease),
          height 650ms var(--ease),
          bottom 650ms var(--ease);
        will-change: transform, filter, opacity, left;
        pointer-events: none;
      }

      .carousel-item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom center;
        user-select: none;
        -webkit-user-drag: none;
      }

      .carousel-item[data-role="center"] {
        left: 50%;
        bottom: 0;
        z-index: 20;
        height: 92%;
        opacity: 1;
        filter: blur(0);
        transform: translateX(-50%) scale(1.68);
        pointer-events: auto;
      }

      .carousel-item[data-role="left"] {
        left: 30%;
        bottom: 12%;
        z-index: 10;
        height: 28%;
        opacity: 0.85;
        filter: blur(2px);
      }

      .carousel-item[data-role="right"] {
        left: 70%;
        bottom: 12%;
        z-index: 10;
        height: 28%;
        opacity: 0.85;
        filter: blur(2px);
      }

      .carousel-item[data-role="back"] {
        left: 50%;
        bottom: 12%;
        z-index: 5;
        height: 22%;
        opacity: 1;
        filter: blur(4px);
      }

      .product-copy {
        position: absolute;
        left: 6vw;
        bottom: 8vh;
        z-index: 60;
        width: min(340px, calc(100vw - 32px));
      }

      .capsule {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.75;
      }

      .product-name {
        margin: 0 0 12px;
        font-size: clamp(18px, 1.65vw, 24px);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.15;
        text-transform: uppercase;
        opacity: 0.96;
      }

      .description {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.86;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .arrow-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        flex: 0 0 64px;
        border: 2px solid #fff;
        border-radius: 999px;
        color: #fff;
        background: transparent;
        cursor: pointer;
        transition: transform 150ms ease, background-color 150ms ease, opacity 150ms ease;
      }

      .arrow-button:hover:not(:disabled) {
        transform: scale(1.08);
        background: rgba(255, 255, 255, 0.12);
      }

      .arrow-button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .add-button {
        min-height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        color: #fff;
        background: var(--panel);
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
        transition: transform 150ms ease, background-color 650ms var(--ease);
      }

      .add-button:hover {
        transform: scale(1.04);
      }

      .discover {
        position: absolute;
        right: 3vw;
        bottom: 8vh;
        z-index: 60;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-family: "Anton", sans-serif;
        font-size: clamp(24px, 4vw, 56px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        opacity: 0.95;
        transition: opacity 200ms ease, transform 200ms ease;
      }

      .discover:hover {
        opacity: 1;
        transform: translateX(3px);
      }

      .progress {
        position: absolute;
        left: 50%;
        bottom: 28px;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 8px;
        transform: translateX(-50%);
      }

      .progress-bar {
        display: block;
        width: 10px;
        height: 2px;
        background: rgba(255, 255, 255, 0.45);
        transition: width 500ms ease, background-color 500ms ease;
      }

      .progress-bar.active {
        width: 32px;
        background: #fff;
      }

      .toast {
        position: fixed;
        top: 78px;
        right: 32px;
        z-index: 90;
        max-width: calc(100vw - 32px);
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 999px;
        color: #fff;
        background: rgba(20, 20, 20, 0.22);
        backdrop-filter: blur(18px);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 639px) {
        .hero {
          min-height: 520px;
        }

        .topbar {
          top: 20px;
          left: 16px;
          right: 16px;
        }

        .nav {
          display: none;
        }

        .ghost-title {
          top: 20%;
          font-size: clamp(86px, 31vw, 150px);
        }

        .carousel-item[data-role="center"] {
          height: 60%;
          bottom: 22%;
          transform: translateX(-50%) scale(1.25);
        }

        .carousel-item[data-role="left"] {
          left: 20%;
          height: 16%;
          bottom: 32%;
        }

        .carousel-item[data-role="right"] {
          left: 80%;
          height: 16%;
          bottom: 32%;
        }

        .carousel-item[data-role="back"] {
          height: 13%;
          bottom: 32%;
        }

        .product-copy {
          left: 16px;
          bottom: max(24px, env(safe-area-inset-bottom));
          width: min(315px, calc(100vw - 32px));
        }

        .capsule {
          margin-bottom: 6px;
          font-size: 10px;
        }

        .product-name {
          margin-bottom: 10px;
          padding-right: 72px;
          font-size: 16px;
        }

        .description {
          display: none;
        }

        .arrow-button {
          width: 48px;
          height: 48px;
          flex-basis: 48px;
        }

        .add-button {
          min-height: 46px;
          padding: 0 16px;
          font-size: 10px;
        }

        .discover {
          right: 16px;
          bottom: max(24px, env(safe-area-inset-bottom));
          gap: 6px;
          font-size: 21px;
        }

        .progress {
          display: none;
        }

        .toast {
          top: 70px;
          right: 16px;
        }
      }

      @media (max-height: 690px) and (min-width: 640px) {
        .product-copy,
        .discover {
          bottom: 42px;
        }

        .carousel-item[data-role="center"] {
          height: 88%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main id="app" class="hero">
      <div class="grain" aria-hidden="true"></div>
      <div class="ghost-title" aria-hidden="true">DROP01</div>

      <header class="topbar">
        <div class="brand-area">
          <a class="brand" href="./" aria-label="ITI inicio">ITI®</a>
          <nav class="nav" aria-label="Navegación principal">
            <a href="#shop">Shop</a>
            <a href="#lookbook">Lookbook</a>
            <a href="#about">About</a>
          </nav>
        </div>

        <button id="cartButton" class="cart-button" type="button" aria-label="Carrito con 0 productos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <path d="M3 6h18"></path>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span>Cart <b id="cartCount">0</b></span>
        </button>
      </header>

      <section id="carousel" class="carousel" aria-label="Carrusel de la colección ITI">
        <article class="carousel-item" data-index="0" data-role="center">
          <img src="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/verde.png" alt="ITI Pit Crew Shirt" draggable="false" />
        </article>
        <article class="carousel-item" data-index="1" data-role="right" aria-hidden="true">
          <img src="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/rosa.png" alt="" draggable="false" />
        </article>
        <article class="carousel-item" data-index="2" data-role="back" aria-hidden="true">
          <img src="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/azul.png" alt="" draggable="false" />
        </article>
        <article class="carousel-item" data-index="3" data-role="left" aria-hidden="true">
          <img src="https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/negro.png" alt="" draggable="false" />
        </article>
      </section>

      <section id="shop" class="product-copy" aria-live="polite">
        <p id="capsule" class="capsule">DROP 01</p>
        <h1 id="productName" class="product-name">iti. Lower Than My Standards · **,** €</h1>
        <p class="description">
          Than My Standards.
        </p>

        <div class="controls">
          <button id="prevButton" class="arrow-button" type="button" aria-label="Producto anterior">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
          </button>

          <button id="nextButton" class="arrow-button" type="button" aria-label="Producto siguiente">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 5 7 7-7 7"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>

          <button id="addButton" class="add-button" type="button">Añadir</button>
        </div>
      </section>

      <a class="discover" href="#shop" aria-label="Ver la colección">
        Ver drop
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </a>

      <div id="progress" class="progress" aria-hidden="true">
        <span class="progress-bar active"></span>
        <span class="progress-bar"></span>
        <span class="progress-bar"></span>
        <span class="progress-bar"></span>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite">Añadido al carrito</div>
      <div id="lookbook" class="sr-only">Lookbook ITI</div>
      <div id="about" class="sr-only">ITI European Streetwear</div>
    </main>

    <script>
      (() => {
        const PRODUCTS = [
          {
            src: "https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/verde.png",
            bg: "#6BBF7A",
            panel: "#85CC92",
            name: "ITI Pit Crew Shirt",
            price: "64,90 €",
            capsule: "DROP 01 / TEAMWEAR",
          },
          {
            src: "https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/rosa.png",
            bg: "#E882B4",
            panel: "#ED9DC4",
            name: "ITI Garage Hoodie",
            price: "79,90 €",
            capsule: "DROP 01 / AFTER HOURS",
          },
          {
            src: "https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/azul.png",
            bg: "#6EB5FF",
            panel: "#8DC4FF",
            name: "ITI Nylon Shorts",
            price: "49,90 €",
            capsule: "DROP 01 / PADDOCK",
          },
          {
            src: "https://r2.fivemanage.com/BJussV6ikZVh2ib1IqMcM/negro.png",
            bg: "#141414",
            panel: "#0e0e0f",
            name: "ITI Nylon Shorts",
            price: "49,90 €",
            capsule: "DROP 01 / PADDOCK",
          },
        ];

        PRODUCTS.forEach(({ src }) => {
          const image = new Image();
          image.src = src;
        });

        let activeIndex = 0;
        let isAnimating = false;
        let cartCount = 0;
        let unlockTimer = null;
        let toastTimer = null;
        let touchStartX = null;

        const root = document.documentElement;
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        const items = [...document.querySelectorAll(".carousel-item")];
        const progressBars = [...document.querySelectorAll(".progress-bar")];
        const capsule = document.getElementById("capsule");
        const productName = document.getElementById("productName");
        const cartCountNode = document.getElementById("cartCount");
        const cartButton = document.getElementById("cartButton");
        const addButton = document.getElementById("addButton");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const toast = document.getElementById("toast");
        const carousel = document.getElementById("carousel");

        function roleFor(index) {
          const left = (activeIndex + 3) % PRODUCTS.length;
          const right = (activeIndex + 1) % PRODUCTS.length;
          const back = (activeIndex + 2) % PRODUCTS.length;

          if (index === activeIndex) return "center";
          if (index === left) return "left";
          if (index === right) return "right";
          if (index === back) return "back";
          return "back";
        }

        function render() {
          const product = PRODUCTS[activeIndex];

          root.style.setProperty("--bg", product.bg);
          root.style.setProperty("--panel", product.panel);
          themeMeta.setAttribute("content", product.bg);
          capsule.textContent = product.capsule;
          productName.textContent = `${product.name} · ${product.price}`;

          items.forEach((item, index) => {
            const role = roleFor(index);
            const image = item.querySelector("img");
            item.dataset.role = role;
            item.setAttribute("aria-hidden", role === "center" ? "false" : "true");
            image.alt = role === "center" ? PRODUCTS[index].name : "";
          });

          progressBars.forEach((bar, index) => {
            bar.classList.toggle("active", index === activeIndex);
          });
        }

        function setButtonsDisabled(value) {
          prevButton.disabled = value;
          nextButton.disabled = value;
        }

        function navigate(direction) {
          if (isAnimating) return;

          isAnimating = true;
          setButtonsDisabled(true);
          activeIndex = direction === "next"
            ? (activeIndex + 1) % PRODUCTS.length
            : (activeIndex + PRODUCTS.length - 1) % PRODUCTS.length;

          render();

          window.clearTimeout(unlockTimer);
          unlockTimer = window.setTimeout(() => {
            isAnimating = false;
            setButtonsDisabled(false);
          }, 650);
        }

        function showToast(message) {
          toast.textContent = message;
          toast.classList.add("visible");
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1400);
        }

        prevButton.addEventListener("click", () => navigate("prev"));
        nextButton.addEventListener("click", () => navigate("next"));

        addButton.addEventListener("click", () => {
          cartCount += 1;
          cartCountNode.textContent = String(cartCount);
          cartButton.setAttribute("aria-label", `Carrito con ${cartCount} productos`);
          showToast(`${PRODUCTS[activeIndex].name} añadido`);
        });

        cartButton.addEventListener("click", () => {
          showToast(cartCount === 0 ? "Tu carrito está vacío" : `${cartCount} producto${cartCount === 1 ? "" : "s"} en el carrito`);
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") navigate("prev");
          if (event.key === "ArrowRight") navigate("next");
        });

        carousel.addEventListener("touchstart", (event) => {
          touchStartX = event.changedTouches[0].clientX;
        }, { passive: true });

        carousel.addEventListener("touchend", (event) => {
          if (touchStartX === null) return;
          const distance = event.changedTouches[0].clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(distance) < 40) return;
          navigate(distance < 0 ? "next" : "prev");
        }, { passive: true });

        render();
      })();
    </script>
  </body>
</html>
